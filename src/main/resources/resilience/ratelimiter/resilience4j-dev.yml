resilience4j:
  ratelimiter:
    instances:
      # Base
      lowTraffic:
        limitForPeriod: 60
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true
      mediumTraffic:
        limitForPeriod: 120
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true
      highTraffic:
        limitForPeriod: 120
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true