resilience4j:
  ratelimiter:
    instances:
      # Base
      lowTraffic:
        limitForPeriod: 30
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true
      mediumTraffic:
        limitForPeriod: 60
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true
      highTraffic:
        limitForPeriod: 90
        limitRefreshPeriod: 30s
        timeoutDuration: 5s
        registerHealthIndicator: true