spring:
  application:
    name: app
  profiles:
    active: dev
  config:
    import:
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # AUTH-022: reject request bodies that contain unknown fields to prevent mass-assignment
      fail-on-unknown-properties: true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: true
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: ${SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${SPRING_RABBITMQ_PUBLISHER_RETURNS:true}
    listener:
      simple:
        acknowledge-mode: manual
      direct:
        acknowledge-mode: manual
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${APP_BASE_URL}/api/v1/auth/oauth2/callback/google"

app:
  base-url: ${APP_BASE_URL}
  security:
    cookie-signing-secret: ${APP_COOKIE_SIGNING_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:App}
    access-token-ttl: ${ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME}
    reset-password-path: ${MAIL_RESET_PASSWORD_PATH:/reset-password}
    frontend-base-url: ${FRONTEND_BASE_URL}
  rate-limit:
    login:
      max-attempts: 10
      window-seconds: 900
    forgot-password:
      max-attempts: 3
      window-seconds: 3600
    resend-verification:
      max-attempts: 3
      window-seconds: 3600

server:
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 1MB

logging:
  level:
    org.springframework.boot.devtools: OFF
    org.apache.catalina: OFF
    org.springframework.web.servlet.DispatcherServlet: OFF
