spring:
  application:
    name: app
  profiles:
    active: dev
  config:
    import:
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: true
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # password: ${REDIS_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${APP_BASE_URL}/api/v1/auth/oauth2/callback/google"

app:
  base-url: ${APP_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:App}
    access-token-ttl: ${ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME}
    reset-password-path: ${MAIL_RESET_PASSWORD_PATH:/reset-password}
    frontend-base-url: ${FRONTEND_BASE_URL}
  rate-limit:
    login:
      max-attempts: 10
      window-seconds: 900
    forgot-password:
      max-attempts: 3
      window-seconds: 3600
    resend-verification:
      max-attempts: 3
      window-seconds: 3600

logging:
  level:
    org.springframework.boot.devtools: OFF
    org.apache.catalina: OFF
    org.springframework.web.servlet.DispatcherServlet: OFF
