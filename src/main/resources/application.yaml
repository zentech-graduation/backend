spring:
  application:
    name: luvax
  profiles:
    active: dev
  config:
    import:
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Explicit pool bounds. Tune DB_POOL_MAX against PostgreSQL max_connections.
      # Default: 20 connections (safe for a max_connections=100 PostgreSQL with headroom).
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: ${SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${SPRING_RABBITMQ_PUBLISHER_RETURNS:true}
    template:
      mandatory: ${SPRING_RABBITMQ_TEMPLATE_MANDATORY:true}
    listener:
      simple:
        acknowledge-mode: manual
      direct:
        acknowledge-mode: manual
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${APP_BASE_URL}/api/v1/auth/oauth2/callback/google"

app:
  base-url: ${APP_BASE_URL}
  auth:
    forgot-password:
      min-response-time: ${AUTH_FORGOT_PASSWORD_MIN_RESPONSE_TIME:200ms}
      max-jitter: ${AUTH_FORGOT_PASSWORD_MAX_JITTER:50ms}

    # Purge job deletes expired + revoked refresh_tokens rows.
    refresh-token-purge:
      expired-grace: ${RT_PURGE_EXPIRED_GRACE:PT1H}
      revoked-retention: ${RT_PURGE_REVOKED_RETENTION:P7D}
      initial-delay: ${RT_PURGE_INITIAL_DELAY:PT5M}
      fixed-delay: ${RT_PURGE_FIXED_DELAY:PT6H}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:100}
      max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:3}
      confirm-timeout: ${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT:PT10S}
      processing-timeout: ${OUTBOX_PUBLISHER_PROCESSING_TIMEOUT:PT2M}
      initial-delay: ${OUTBOX_PUBLISHER_INITIAL_DELAY:PT10S}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:PT5S}
      retry-backoffs:
        - ${OUTBOX_PUBLISHER_RETRY_BACKOFF_1:PT10S}
        - ${OUTBOX_PUBLISHER_RETRY_BACKOFF_2:PT30S}
        - ${OUTBOX_PUBLISHER_RETRY_BACKOFF_3:PT60S}
  messaging:
    consumer:
      max-attempts: ${RABBIT_CONSUMER_MAX_ATTEMPTS:3}
      retry-backoffs:
        - ${RABBIT_CONSUMER_RETRY_BACKOFF_1:PT10S}
        - ${RABBIT_CONSUMER_RETRY_BACKOFF_2:PT30S}
        - ${RABBIT_CONSUMER_RETRY_BACKOFF_3:PT60S}
  security:
    cookie-signing-secret: ${APP_COOKIE_SIGNING_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    consumer:
      enabled: ${MAIL_CONSUMER_ENABLED:false}
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME}
    app-name: ${MAIL_APP_NAME}
    reset-password-path: ${MAIL_RESET_PASSWORD_PATH:/reset-password}
    verify-email-path: ${MAIL_VERIFY_EMAIL_PATH:/verify-email}
    frontend-base-url: ${FRONTEND_BASE_URL}
  notification:
    consumer:
      enabled: ${NOTIFICATION_CONSUMER_ENABLED:false}
  media:
    cdn-base-url: ${MEDIA_CDN_BASE_URL:}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      region: ${R2_REGION:auto}
      upload-url-ttl: ${R2_UPLOAD_URL_TTL:PT10M}
    allowed-image-mime-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-video-mime-types:
      - video/mp4
      - video/webm
    storage-key-pattern: ${MEDIA_STORAGE_KEY_PATTERN:^[a-zA-Z0-9][a-zA-Z0-9/_.-]{1,511}$}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:PT5S}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:PT30S}
  hashtag:
    consumer:
      enabled: ${HASHTAG_CONSUMER_ENABLED:false}
    trending:
      window: ${HASHTAG_TRENDING_WINDOW:PT24H}
      job-delay: ${HASHTAG_TRENDING_JOB_DELAY:PT1H}
      job-initial-delay: ${HASHTAG_TRENDING_JOB_INITIAL_DELAY:PT5M}
    seed:
      enabled: ${HASHTAG_SEED_ENABLED:true}
  post:
    consumer:
      enabled: ${POST_CONSUMER_ENABLED:false}
    seed:
      enabled: ${POST_SEED_ENABLED:true}
  comment:
    slow-mode-seconds: ${COMMENT_SLOW_MODE_SECONDS:0}
    idempotency-ttl-hours: ${COMMENT_IDEMPOTENCY_TTL_HOURS:24}
    blocked-words: []
    consumer:
      enabled: ${COMMENT_CONSUMER_ENABLED:false}
    live:
      enabled: ${COMMENT_LIVE_ENABLED:false}
  story:
    consumer:
      enabled: ${STORY_CONSUMER_ENABLED:false}
    cleanup:
      initial-delay: ${STORY_CLEANUP_INITIAL_DELAY:PT10M}
      fixed-delay: ${STORY_CLEANUP_FIXED_DELAY:PT1H}
  rate-limit:
    endpoint-rules:
      "[/api/v1/auth/login]":
        max-attempts: 10
        window-seconds: 900
      "[/api/v1/auth/register]":
        max-attempts: 5
        window-seconds: 3600
      "[/api/v1/auth/refresh]":
        max-attempts: 60
        window-seconds: 60
      "[/api/v1/auth/forgot-password]":
        max-attempts: 3
        window-seconds: 3600
      "[/api/v1/auth/reset-password]":
        max-attempts: 3
        window-seconds: 3600
      "[/api/v1/auth/verify-email]":
        max-attempts: 5
        window-seconds: 3600
      "[/api/v1/auth/verify-email/resend]":
        max-attempts: 3
        window-seconds: 3600
      "[/api/v1/posts]":
        max-attempts: 30
        window-seconds: 60
      "[/api/v1/stories]":
        max-attempts: 30
        window-seconds: 60
      "[/api/v1/stories/feed]":
        max-attempts: 60
        window-seconds: 60
      # Note: path-variable endpoints (e.g. /posts/{id}/likes) require AuthRateLimitFilter pattern-matching support before per-path rules can be configured.

management:
  health:
    elasticsearch:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized

server:
  # Forward-headers-strategy removed; IpExtractor + trusted-proxy-cidrs is the only model.
  # Configure app.security.trusted-proxy-cidrs to your ingress CIDR(s) before deploying behind a proxy.
  tomcat:
    max-http-form-post-size: 1MB

logging:
  level:
    org.springframework.boot.devtools: OFF
    org.apache.catalina: OFF
    org.springframework.web.servlet.DispatcherServlet: OFF
