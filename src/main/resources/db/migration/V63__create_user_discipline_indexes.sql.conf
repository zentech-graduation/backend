# CREATE INDEX CONCURRENTLY cannot run inside a transaction block, so this migration opts out of
# Flyway's default transactional execution, as V57 did.
#
# The tradeoff this buys and the one it costs:
#   Buys - uniformity. Every index-creating migration in this project builds CONCURRENTLY, so no
#          reviewer has to judge whether a given table was hot enough to need it.
#   Costs - a failed CONCURRENTLY build leaves an INVALID index behind rather than rolling back.
#          Every statement here is IF NOT EXISTS, so a re-run after a failure skips the ones that
#          completed; an INVALID index from a failed build must be dropped by hand before the retry.
#          That matters most for uq_user_strikes_active_number, which is a correctness guard: check
#          it is valid after this migration, not merely present.
#            SELECT c.relname FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
#             WHERE NOT i.indisvalid;
executeInTransaction=false
