# CREATE INDEX CONCURRENTLY cannot run inside a transaction block, so this migration opts out of
# Flyway's default transactional execution, following the V57 precedent.
#
# The tradeoff this buys and the one it costs:
#   Buys - the build does not hold a lock that blocks writes to outbox_events. Every domain event
#          inserts into that table, so a plain CREATE INDEX would stall every write path in the
#          application for the duration of the build.
#   Costs - a failed CONCURRENTLY build leaves an INVALID index behind rather than rolling back.
#          The statement is IF NOT EXISTS, so a re-run after a failure is safe, but an INVALID index
#          from a failed build must be dropped by hand before the retry.
#          Check with:
#            SELECT c.relname FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
#             WHERE NOT i.indisvalid;
executeInTransaction=false
