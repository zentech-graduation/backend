spring:
  config:
    import:
      - classpath:resilience/circuitbreaker/resilience4j-dev.yml
      - classpath:resilience/ratelimiter/resilience4j-dev.yml
      - classpath:resilience/retry/resilience4j-dev.yml

jpa:
  hibernate:
    ddl-auto: validate
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      use_sql_comments: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    disable-swagger-default-url: true

app:
  mail:
    app-name: ${MAIL_APP_NAME}
    frontend-base-url: ${FRONTEND_BASE_URL}
  security:
    trusted-proxy-cidrs:
      - "127.0.0.1"
    max-login-body-bytes: 2048
  rate-limit:
    endpoint-rules:
      "/api/v1/auth/register":
        max-attempts: 5
        window-seconds: 60
      "/api/v1/auth/login":
        max-attempts: 10
        window-seconds: 60
      "/api/v1/auth/refresh":
        max-attempts: 30
        window-seconds: 60
      "/api/v1/auth/forgot-password":
        max-attempts: 3
        window-seconds: 300
      "/api/v1/auth/reset-password":
        max-attempts: 5
        window-seconds: 300
      "/api/v1/auth/verify-email":
        max-attempts: 10
        window-seconds: 60
      "/api/v1/auth/verify-email/resend":
        max-attempts: 3
        window-seconds: 300