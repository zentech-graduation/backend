spring:
  config:
    import:
      - classpath:resilience/circuitbreaker/resilience4j-dev.yml
      - classpath:resilience/ratelimiter/resilience4j-dev.yml
      - classpath:resilience/retry/resilience4j-dev.yml
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    disable-swagger-default-url: true

app:
  notification:
    consumer:
      enabled: true
  hashtag:
    consumer:
      enabled: true
  post:
    consumer:
      enabled: true
  comment:
    consumer:
      enabled: true
    live:
      enabled: true
  story:
    consumer:
      enabled: true
  mail:
    consumer:
      enabled: true
    app-name: ${MAIL_APP_NAME}
    frontend-base-url: ${FRONTEND_BASE_URL}
  security:
    trusted-proxy-cidrs:
      - "127.0.0.1"
    max-login-body-bytes: 2048
    cookie-signing-secret: "dev-insecure-cookie-signing-secret-change-me"
  rate-limit:
    endpoint-rules:
      "[/api/v1/auth/login]":
        max-attempts: 10
        window-seconds: 60
      "[/api/v1/auth/register]":
        max-attempts: 100
        window-seconds: 60
      "[/api/v1/auth/refresh]":
        max-attempts: 100
        window-seconds: 60
      "[/api/v1/auth/forgot-password]":
        max-attempts: 3
        window-seconds: 300
      "[/api/v1/auth/reset-password]":
        max-attempts: 50
        window-seconds: 300
      "[/api/v1/auth/verify-email]":
        max-attempts: 50
        window-seconds: 60
      "[/api/v1/auth/verify-email/resend]":
        max-attempts: 50
        window-seconds: 300
      "[/api/v1/auth/oauth2/exchange]":
        max-attempts: 10
        window-seconds: 60
      "[/api/v1/posts]":
        max-attempts: 200
        window-seconds: 60
      "[/api/v1/stories]":
        max-attempts: 200
        window-seconds: 60
      "[/api/v1/stories/feed]":
        max-attempts: 200
        window-seconds: 60
      "[/api/v1/conversations]":
        max-attempts: 200
        window-seconds: 60
      # Note: path-variable endpoints (e.g. /posts/{id}/likes) require AuthRateLimitFilter pattern-matching support before per-path rules can be configured.