<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Message</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #0F0F0F; line-height: 1.6;">
<div style="max-width: 560px; margin: 0 auto; padding: 48px 24px;">

    <span th:text="${appName}" style="display: block; font-size: 16px; font-weight: 700; color: #0F0F0F; margin-bottom: 40px;">Luvax</span>

    <!-- The only administrator-authored region. Already rendered from Markdown and filtered by
         CampaignBodyRenderer's allowlist, so th:utext here is safe: the sanitizer has already run
         and this is byte-for-byte the HTML the preview endpoint returned. -->
    <div th:utext="${bodyHtml}" style="font-size: 15px; color: #4B4B4B; line-height: 1.6;">Body.</div>

    <hr style="border: none; border-top: 1px solid #E8E8E8; margin: 36px 0;">

    <!-- Supplied by the application and not editable by the author. A campaign is marketing, so the
         unsubscribe link is not optional, and the last sentence is what stops a recipient believing
         they have switched off their password resets. -->
    <p style="font-size: 12px; color: #8C8C8C; line-height: 1.6; margin: 0;">
        You received this because you have an account on <span th:text="${appName}">Luvax</span>.
        <a th:href="${unsubscribeUrl}" style="color: #8C8C8C;">Unsubscribe from emails like this</a>.
        Account and security emails are not affected.
    </p>

</div>
</body>
</html>
