name: Feature Request
description: Propose a new feature or enhancement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches were considered?
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - auth
        - mail
        - users
        - social
        - media
        - post
        - comment
        - hashtag
        - story
        - notification
        - message
        - report
        - admin
        - recommendation
        - common
        - other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
