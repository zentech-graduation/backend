# Every published port is bound to the loopback interface. These services carry real credentials
# and hold real data, and publishing them on all interfaces exposes a developer's database, cache,
# broker, and search cluster to anyone on the same network. Mailpit already documented this
# reasoning for itself; the rest of the stack now follows it.
services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - '127.0.0.1:5432:5432'
    # PGDATA in postgres:18 is /var/lib/postgresql/18/docker, not the pre-18
    # /var/lib/postgresql/data. Mounting the parent covers it and matches where the image's own
    # anonymous volume sat. A named volume at the pre-18 path would create an empty directory
    # nobody reads and leave the real data on a volume discarded with the container.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: 'rabbitmq:latest'
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - '127.0.0.1:5672:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP sink for development. Bound to the loopback interface only, unlike the services
  # above: Mailpit accepts mail from anyone and serves every message it receives through an
  # unauthenticated web UI, so publishing it on all interfaces would expose a developer's inbox
  # to the local network.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Left disabled deliberately. Enabling it would require credential wiring through the
      # application and every integration test for no local benefit, and the loopback bind above
      # is what actually removes the exposure that mattered.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  elasticsearch_data:
  postgres_data:
